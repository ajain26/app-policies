<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clicko – Smart TV Remote</title>
  <style>
    :root {
      --bg: #0D0D1A;
      --surface: #16161F;
      --accent: #6C63FF;
      --text: #E8E8F0;
      --muted: #9898A8;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      padding: 24px 20px 60px;
      max-width: 700px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    header { text-align: center; padding: 32px 0 8px; }
    h1 { font-size: 30px; font-weight: 700; color: var(--text); }
    .subtitle { color: var(--muted); font-size: 15px; margin-top: 6px; }
    .card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 20px;
      margin-top: 16px;
      text-align: center;
    }
    .links { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
    .links a {
      display: block;
      background: rgba(108, 99, 255, 0.12);
      border: 1px solid rgba(108, 99, 255, 0.3);
      color: var(--accent);
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
    }
    footer { text-align: center; margin-top: 32px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <h1>Clicko</h1>
    <p class="subtitle">Turn your iPhone into a universal remote for Samsung, LG, Roku, Sony, and Fire TV.</p>
  </header>

  <div class="card">
    <div class="links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Use</a>
      <a href="support.html">Support</a>
    </div>
  </div>

  <footer>
    Clicko – Smart TV Remote
  </footer>

</body>
</html>
